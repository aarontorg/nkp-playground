apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cert-injector
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: cert-injector
  template:
    metadata:
      labels:
        app: cert-injector
    spec:
      initContainers:
      - name: cert-installer
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            cp /tmp/certs/custom-ca.crt /host/etc/pki/ca-trust/source/anchors/
            nsenter --target 1 --mount --update-host-certs update-ca-trust extract
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-pki
          mountPath: /host/etc/pki
        - name: custom-ca-source
          mountPath: /tmp/certs
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
      hostPID: true
      volumes:
      - name: host-pki
        hostPath:
          path: /etc/pki
      - name: custom-ca-source
        configMap:
          name: my-cluster-ca-configmap