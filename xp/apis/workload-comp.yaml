# Test cluster has less apps
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: workload
spec:
  compositeTypeRef:
    apiVersion: nkp.io/v1alpha1
    kind: WorkloadCluster
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: pcCreds
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: kubernetes-provider
                deletionPolicy: Delete
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      labels:
                        cluster.x-k8s.io/provider: nutanix
                        konvoy/provider: nutanix
                    type: Opaque
            patches:
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-pc-credentials'
                    type: string
              - fromFieldPath: spec.workSpaceName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-pc-secret'
                    type: string
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.labels["konvoy.d2iq.io/cluster-name"]
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.manifest.data.credentials
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: spec.pc.key
                  strategy: string
                  string:
                    fmt: |
                      [
                        {
                          "type": "basic_auth",
                          "data": {
                            "prismCentral": {
                                "username": "admin",
                                "password": "%s"
                              }
                          }
                        }
                      ]
                transforms:
                  - type: string
                    string:
                      type: Convert
                      convert: ToBase64
          - name: pcCredsForCSI
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: kubernetes-provider
                deletionPolicy: Delete
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      labels:
                        cluster.x-k8s.io/provider: nutanix
                        konvoy.d2iq.io/provider: nutanix
                    type: Opaque
            patches:
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-pc-credentials-for-csi'
                    type: string
              - fromFieldPath: spec.workSpaceName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-pc-for-csi-secret'
                    type: string
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.labels["konvoy.d2iq.io/cluster-name"]
                transforms:
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.manifest.data.key
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: spec.pc.ipAddress
                    - fromFieldPath: spec.pc.key
                  strategy: string
                  string:
                    fmt: "%s:9440:admin:%s"
                transforms:
                  - type: string
                    string:
                      type: Convert
                      convert: ToBase64
          - name: pcCredsForKonnector
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: kubernetes-provider
                deletionPolicy: Delete
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      labels:
                        cluster.x-k8s.io/provider: nutanix
                        konvoy.d2iq.io/provider: nutanix
                    type: Opaque
                    data:
                      username: 'YWRtaW4=' # Maybe put in API
            patches:
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-pc-credentials-for-konnector-agent'
                    type: string
              - fromFieldPath: spec.workSpaceName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-pc-for-konnector-agent-secret'
                    type: string
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.labels["konvoy.d2iq.io/cluster-name"]
              - fromFieldPath: spec.pc.key
                toFieldPath: spec.forProvider.manifest.data.password
                policy:
                  fromFieldPath: Required
                transforms:
                  - type: string
                    string:
                      type: Convert
                      convert: ToBase64
          - name: nkpCluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: kubernetes-provider
                deletionPolicy: Delete
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: clusters.nkp.nutanix.com/v1alpha1 #cluster.x-k8s.io/v1beta1
                    kind: NKPCluster #Cluster
                    metadata:
                      labels:
                        cluster.x-k8s.io/provider: nutanix
                        konvoy.d2iq.io/provider: nutanix
                    spec:
                      capiCluster:
                        clusterNetwork:
                          pods:
                            cidrBlocks:
                            - 192.168.0.0/16 #PATCH
                          services:
                            cidrBlocks:
                            - 10.96.0.0/12 #PATCH
                        topology:
                          classRef:
                            name: patch
                          controlPlane:
                            replicas: 3
                          variables:
                          - name: clusterConfig
                            value:
                              addons:
                                ccm:
                                  strategy: HelmAddon
                                clusterAutoscaler:
                                  strategy: HelmAddon
                                cni:
                                  provider: Cilium
                                  strategy: HelmAddon
                                cosi:
                                  strategy: HelmAddon
                                csi:
                                  defaultStorage:
                                    provider: nutanix
                                    storageClassConfig: volume
                                  providers:
                                    nutanix:
                                      credentials:
                                        secretRef:
                                          name: patch #XP
                                      storageClassConfigs:
                                        volume:
                                          allowExpansion: true
                                          parameters:
                                            csi.storage.k8s.io/fstype: ext4
                                            description: CSI StorageClass nutanix-volume for yamltest
                                            flashMode: DISABLED
                                            hypervisorAttached: ENABLED
                                            storageContainer: SelfServiceContainer
                                            storageType: NutanixVolumes
                                          reclaimPolicy: Delete
                                          volumeBindingMode: WaitForFirstConsumer
                                      strategy: HelmAddon
                                  snapshotController:
                                    strategy: HelmAddon
                                konnectorAgent:
                                  credentials:
                                    secretRef:
                                      name: patch # XP
                                nfd:
                                  strategy: HelmAddon
                                registry:
                                  provider: CNCF Distribution
                                serviceLoadBalancer:
                                  configuration:
                                    addressRanges:
                                    - end: patch # XP
                                      start: patch # XP
                                  provider: MetalLB
                              controlPlane:
                                autoRenewCertificates:
                                  daysBeforeExpiry: 180
                                nodeRegistration:
                                  ignorePreflightErrors:
                                  - SystemVerification
                                nutanix:
                                  machineDetails:
                                    bootType: uefi
                                    cluster:
                                      name: patch #XP
                                      type: name
                                    image:
                                      name: patch #XP
                                      type: name
                                    memorySize: 16Gi
                                    subnets:
                                    - name: patch #XP
                                      type: name
                                    systemDiskSize: 80Gi
                                    vcpuSockets: 4
                                    vcpusPerSocket: 1
                              dns:
                                coreDNS: {}
                              encryptionAtRest:
                                providers:
                                - secretbox: {}
                              kubeProxy:
                                mode: disabled
                              nutanix:
                                controlPlaneEndpoint:
                                  port: 6443
                                  virtualIP:
                                    provider: KubeVIP
                                prismCentralEndpoint:
                                  credentials:
                                    secretRef:
                                      name: patch #XP
                                  insecure: true
                              users:
                                - name: nutanix
                                  sshAuthorizedKeys:
                                    - "patch"
                                  sudo: ALL=(ALL) NOPASSWD:ALL
                          workers:
                            machineDeployments:
                            - class: default-worker
                              metadata:
                                annotations:
                                  cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "4"
                                  cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "4"
                              name: md-0
                              variables:
                                overrides:
                                - name: workerConfig
                                  value:
                                    nodeRegistration:
                                      ignorePreflightErrors:
                                      - SystemVerification
                                    nutanix:
                                      machineDetails:
                                        bootType: uefi
                                        cluster:
                                          type: name
                                        image:
                                          type: name
                                        memorySize: 32Gi
                                        subnets:
                                        - type: name
                                        systemDiskSize: 80Gi
                                        vcpuSockets: 8
                                        vcpusPerSocket: 1
                      #capiClusterRef:
                      #  name: patch
                      #  namespace: patch
                      # kommanderCluster:
                      #   labels:
                      #     cluster.x-k8s.io/cluster-name: patch
                      #     cluster.x-k8s.io/provider: nutanix
                      #     composition: worklaod
                      #     cost-center: mine
