                      # kommanderClusterRef:
                      #   name: patch #devtest-1
                      #   namespace: patch #devtest1
                      # version: patch #v2.18.0    
            patches:
              # NEW FOR 2.18
              - fromFieldPath: spec.nkpVersion
                toFieldPath: spec.forProvider.manifest.spec.version
              #- fromFieldPath: spec.workSpaceName
              #  toFieldPath: spec.forProvider.manifest.spec.kommanderClusterRef.namespace
              #- fromFieldPath: spec.workloadClusterName
              #  toFieldPath: spec.forProvider.manifest.spec.kommanderClusterRef.name
              #- fromFieldPath: spec.nkpVersion
              #  toFieldPath: spec.forProvider.manifest.spec.kommanderCluster.spec.platform.version
             # - fromFieldPath: spec.workloadClusterName
               # toFieldPath: spec.forProvider.manifest.spec.kommanderCluster.spec.ociRegistry.certSecretRef.name
               # transforms:
               #   - string:
               #       type: Format
               #       fmt: '%s-oci-cert'
               #     type: string
              #- fromFieldPath: spec.workSpaceName
              #  toFieldPath: spec.forProvider.manifest.spec.kommanderCluster.spec.namespaceRef.name
              #- fromFieldPath: spec.workloadClusterName
              #  toFieldPath: spec.forProvider.manifest.spec.kommanderCluster.spec.kubeconfigRef.name
              #  transforms:
              #    - string:
              #        type: Format
              #        fmt: '%s-kubeconfig'
              #      type: string
              #- fromFieldPath: spec.workSpaceName
              #  toFieldPath: spec.forProvider.manifest.spec.kommanderCluster.spec.clusterRef.capiCluster.namespace
              #- fromFieldPath: spec.workloadClusterName
              #  toFieldPath: spec.forProvider.manifest.spec.kommanderCluster.spec.clusterRef.capiCluster.name
              #- fromFieldPath: spec.workloadClusterName
              #  toFieldPath: spec.forProvider.manifest.spec.capiClusterRef.name
              # - fromFieldPath: spec.workSpaceName
              #  toFieldPath: spec.forProvider.manifest.spec.capiClusterRef.namespace
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.name
              - fromFieldPath: spec.workSpaceName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-cluster'
                    type: string
              - fromFieldPath: spec.workloadClusterName
