              - fromFieldPath: spec.pc.clusterName
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.variables[0].value.controlPlane.nutanix.machineDetails.cluster.name
              - fromFieldPath: spec.nkpImageName
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.variables[0].value.controlPlane.nutanix.machineDetails.image.name
              - fromFieldPath: spec.pc.subnetName
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.variables[0].value.controlPlane.nutanix.machineDetails.subnets[0].name
              - fromFieldPath: spec.loadBalancer.vip
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.variables[0].value.nutanix.controlPlaneEndpoint.host
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.variables[0].value.nutanix.prismCentralEndpoint.credentials.secretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: '%s-pc-credentials'
              - fromFieldPath: spec.pubKey
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.variables[0].value.users[0].sshAuthorizedKeys[0]
              - fromFieldPath: spec.pc.ipAddress
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.variables[0].value.nutanix.prismCentralEndpoint.url
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "https://%s:9440"
              - fromFieldPath: spec.k8sVersion
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.version
              - fromFieldPath: spec.pc.clusterName
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.workers.machineDeployments[0].variables.overrides[0].value.nutanix.machineDetails.cluster.name
              - fromFieldPath: spec.pc.subnetName
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.workers.machineDeployments[0].variables.overrides[0].value.nutanix.machineDetails.subnets[0].name
              - fromFieldPath: spec.nkpImageName
                toFieldPath: spec.forProvider.manifest.spec.capiCluster.topology.workers.machineDeployments[0].variables.overrides[0].value.nutanix.machineDetails.image.name
              - fromFieldPath: spec.crossplane.compositionRef.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.composition
          ### PROVIDERCONFIG
          - name: k8s-provider-cfg
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: kubernetes-provider
                deletionPolicy: Delete
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: ProviderConfig
                    metadata:
                      name: patch
                      namespace: patch
                    spec:
                      credentials:
                        secretRef:
                          key: value
                          name: patch
                          namespace: patch
                        source: Secret
            patches: 
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-providerconfig'
                    type: string
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.metadata.name
              - fromFieldPath: spec.workSpaceName
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.forProvider.manifest.spec.credentials.secretRef.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-kubeconfig'
                    type: string
              - fromFieldPath: spec.workSpaceName
                toFieldPath: spec.forProvider.manifest.spec.credentials.secretRef.namespace
          ### Latest Tag Policy
          - name: dissallow-latest-tag-template
            base: 
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: patch
                deletionPolicy: Delete
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: templates.gatekeeper.sh/v1
                    kind: ConstraintTemplate
                    metadata:
                      name: k8sdisallowlatesttag
                      annotations:
                        description: >-
                          Requires container images to use an explicit, non-latest version tag.
                    spec:
                      crd:
                        spec:
                          names:
                            kind: K8sDisallowLatestTag
                      targets:
                        - target: admission.k8s.gatekeeper.sh
                          rego: |
                            package k8sdisallowlatesttag

                            violation[{"msg": msg}] {
                              container := input.review.object.spec.containers[_]
                              has_latest_tag(container.image)
                              msg := sprintf("Container '%v' uses a forbidden 'latest' image tag in image '%v'. Please specify a fixed version.", [container.name, container.image])
                            }

                            # Check for explicit :latest tag
                            has_latest_tag(image) {
                              endswith(image, ":latest")
                            }

                            # Check for missing tag (Kubernetes defaults implicitly to latest)
                            has_latest_tag(image) {
                              # If it doesn't contain a colon at all, it lacks a tag
                              not contains(image, ":")
                            }

                            # Handle cases where registry contains a port (e.g. my-registry:5000/repo) but no image tag
                            has_latest_tag(image) {
                              contains(image, ":")
                              # Split by slash to isolate the image name from the registry domain
                              parts := split(image, "/")
                              last_part := parts[count(parts) - 1]
                              not contains(last_part, ":")
                            }
            patches: 
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: spec.providerConfigRef.name
              - fromFieldPath: spec.workloadClusterName
                toFieldPath: metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-dissallow-latest-template'
                    type: string