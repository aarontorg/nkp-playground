                      #     kubeconfigRef:
                      #       name: patch #devtest-1-kubeconfig
                      #     namespaceRef:
                      #       name: patch #devtest1
                      #     ociRegistry:
                      #       certSecretRef:
                      #         name: patch #devtest-1-oci-cert
