apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: workloadclusters.nkp.io
spec:
  scope: Cluster
  group: nkp.io
  names:
    kind: WorkloadCluster #Rename this after current res
    plural: workloadclusters # Rename
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                workloadClusterName:
                  type: string
                workSpaceName:
                  type: string
                nkpVersion:
                  type: string
                pc:
                  type: object
                  properties:
                    key:
                      type: string
                    ipAddress:
                      type: string
                    clusterName:
                      type: string
                    subnetName:
                      type: string
                  required:
                    - key
                    - ipAddress
                    - clusterName
                    - subnetName
                k8sImageName:
                  type: string
                k8sVersion:
                  type: string
                loadBalancer:
                  type: object
                  properties:
                    vip:
                      type: string
                    start:
                      type: string
                    end:
                      type: string
                  required:
                    - start
                    - end
                    - vip
              required:
                - workloadClusterName
                - workSpaceName
                - k8sVersion
                - k8sImageName
                - pc
                - loadBalancer
            status:
              properties:
                misc:
                  type: string
              type: object
