apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    cluster.x-k8s.io/provider: nutanix
    konvoy.d2iq.io/cluster-name: torg-cluster1
    konvoy.d2iq.io/provider: nutanix
  name: torg-cluster1
  namespace: torg
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/16
    services:
      cidrBlocks:
      - 10.96.0.0/12
  controlPlaneEndpoint:
    host: ""
    port: 0
  topology:
    class: nkp-nutanix-v2.17.1
    controlPlane:
      metadata: {}
      replicas: 3
    variables:
    - name: clusterConfig
      value:
        addons:
          ccm:
            credentials:
              secretRef:
                name: torg-pc-credentials
            strategy: HelmAddon
          clusterAutoscaler:
            strategy: HelmAddon
          cni:
            provider: Cilium
            strategy: HelmAddon
          cosi:
            strategy: HelmAddon
          csi:
            defaultStorage:
              provider: nutanix
              storageClassConfig: volume
            providers:
              nutanix:
                credentials:
                  secretRef:
                    name: torg-pc-credentials-for-csi
                storageClassConfigs:
                  volume:
                    allowExpansion: true
                    parameters:
                      csi.storage.k8s.io/fstype: ext4
                      description: CSI StorageClass nutanix-volume for torg-cluster1
                      flashMode: DISABLED
                      hypervisorAttached: ENABLED
                      storageContainer: SelfServiceContainer
                      storageType: NutanixVolumes
                    reclaimPolicy: Delete
                    volumeBindingMode: WaitForFirstConsumer
                strategy: HelmAddon
            snapshotController:
              strategy: HelmAddon
          konnectorAgent:
            credentials:
              secretRef:
                name: torg-pc-credentials-for-konnector-agent
          nfd:
            strategy: HelmAddon
          registry:
            provider: CNCF Distribution
          serviceLoadBalancer:
            configuration:
              addressRanges:
              - end: 10.8.50.125
                start: 10.8.50.113
            provider: MetalLB
        controlPlane:
          autoRenewCertificates:
            daysBeforeExpiry: 180
          nodeRegistration:
            ignorePreflightErrors:
            - SystemVerification
          nutanix:
            machineDetails:
              bootType: uefi
              cluster:
                name: RNO-SPOC007-3
                type: name
              image:
                name: nkp-ubuntu-24.04-release-cis-1.34.3-20260226170017
                type: name
              memorySize: 16Gi
              subnets:
              - name: primary-RNO-SPOC007-3
                type: name
              systemDiskSize: 80Gi
              vcpuSockets: 4
              vcpusPerSocket: 1
        dns:
          coreDNS: {}
        encryptionAtRest:
          providers:
          - secretbox: {}
        kubeProxy:
          mode: disabled
        nutanix:
          controlPlaneEndpoint:
            host: 10.8.50.112
            port: 6443
            virtualIP:
              provider: KubeVIP
          prismCentralEndpoint:
            credentials:
              secretRef:
                name: torg-pc-credentials
            insecure: true
            url: https://10.8.50.7:9440
    version: v1.34.3
    workers:
      machineDeployments:
      - class: default-worker
        metadata:
          annotations:
            cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "4"
            cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "4"
        name: md-0
        variables:
          overrides:
          - name: workerConfig
            value:
              nodeRegistration:
                ignorePreflightErrors:
                - SystemVerification
              nutanix:
                machineDetails:
                  bootType: uefi
                  cluster:
                    name: RNO-SPOC007-3
                    type: name
                  image:
                    name: nkp-ubuntu-24.04-release-cis-1.34.3-20260226170017
                    type: name
                  memorySize: 32Gi
                  subnets:
                  - name: primary-RNO-SPOC007-3
                    type: name
                  systemDiskSize: 80Gi
                  vcpuSockets: 8
                  vcpusPerSocket: 1
