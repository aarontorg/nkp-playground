apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: realm
spec:
  compositeTypeRef:
    apiVersion: nkp.io/v1alpha1
    kind: Realm
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: workspace
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: kubernetes-provider
                forProvider:
                  manifest:
                    apiVersion: workspaces.kommander.mesosphere.io/v1alpha1
                    kind: Workspace
                    metadata:
                      annotations:
                        kommander.mesosphere.io/description: ""
                        workspace.kommander.mesosphere.io/default-app-deployments-created: "true"
                      labels:
                        caren.nutanix.com/namespace-sync: ""
                    spec:
                      namespaceName: ""
                      version: "" #v2.17.1
            patches:
              - fromFieldPath: spec.id
                toFieldPath: spec.forProvider.manifest.metadata.name
              - fromFieldPath: spec.id
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: '%s-workspace'
              - fromFieldPath: spec.id
                toFieldPath: spec.forProvider.manifest.metadata.annotations["kommander.mesosphere.io/display-name"]
              - fromFieldPath: spec.id
                toFieldPath: spec.forProvider.manifest.metadata.labels["workspaces.kommander.mesosphere.io/workspace-name"]
              - fromFieldPath: spec.nkpVersion
                toFieldPath: spec.forProvider.manifest.spec.version
              - fromFieldPath: spec.id
                toFieldPath: spec.forProvider.manifest.spec.namespaceName
          - name: pcCreds
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: kubernetes-provider
                deletionPolicy: Delete
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      labels:
                        cluster.x-k8s.io/provider: nutanix
                        #konvoy.d2iq.io/cluster-name: yamltest
                        konvoy.d2iq.io/provider: nutanix
                      name: yamltest-pc-credentials
                      namespace: yamltest-2026n-1
                    type: Opaque
            patches:
              - fromFieldPath: spec.id
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-pc-credentials-for-csi'
                    type: string
              - fromFieldPath: spec.id
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - fromFieldPath: spec.id
                toFieldPath: metadata.name
                transforms:
                  - string:
                      type: Format
                      fmt: '%s-csi-secret'
                    type: string
              - fromFieldPath: spec.id
                toFieldPath: spec.forProvider.manifest.metadata.labels["konvoy.d2iq.io/cluster-name"]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: '%s-cluster1'
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.manifest.data.key
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: spec.pc.key
                  strategy: string
                  string:
                    fmt: |
                      [
                        {
                          "type": "basic_auth",
                          "data": {
                            "prismCentral": {
                                "username": "admin",
                                "password": "%s"
                              }
                          }
                        }
                      ]
