apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredClusterTags
metadata:
  name: enforce-corporate-cluster-tags
spec:
  match:
    kinds:
      - apiGroups: ["clusters.nkp.nutanix.com"] # Targets Cluster API (NKP's provisioning engine) cluster.x-k8s.io
        kinds: ["NKPCluster"]
    excludedNamespaces:
      - "kommander"
  parameters:
    labels:
      - "cluster.x-k8s.io/provider"