apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-policy-rbac
  namespace: workloads-0
data:
  rbac.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: project-gatekeeper-policy-manager
    rules:
      - apiGroups: ["templates.gatekeeper.sh", "constraints.gatekeeper.sh"]
        resources: ["*"]
        verbs: ["*"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: cluster-policy-gatekeeper-manager
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: project-gatekeeper-policy-manager
    subjects:
      - kind: ServiceAccount
        name: cluster-policy
        namespace: cluster-policy
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: cluster-policy-rbac-bootstrap
  namespace: workloads-0
spec:
  strategy: Reconcile
  clusterSelector:
    matchExpressions:
      - key: cluster.x-k8s.io/cluster-name
        operator: Exists
  resources:
    - name: cluster-policy-rbac
      kind: ConfigMap

