apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowPrivileged
metadata:
  name: block-privileged-containers
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    # Critical: System namespaces must be excluded so your cluster can function
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - calico-system
      - ntnx-system

