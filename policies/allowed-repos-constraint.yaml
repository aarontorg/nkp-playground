apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: enforce-trusted-registry
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - "kube-system"          # 🛑 CRITICAL: Do not block core Kubernetes system images
      - "gatekeeper-system"    # Do not block the policy engine itself
      - "nkp-system"           # Do not block NKP operational agents
  parameters:
    repos:
      - "harbor.corporate.local/"  # Example Internal Private Registry
      - "://amazonaws.com" # Example Private AWS ECR

